name: بلاغ خلل
description: الإبلاغ عن مشكلة قابلة لإعادة الإنتاج
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: وصف المشكلة
      description: ماذا حدث؟
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: خطوات إعادة المشكلة
      placeholder: "1. افتح التطبيق\n2. الصق الروابط\n3. اضغط..."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: الجهاز وإصدار أندرويد
      placeholder: "مثال: Pixel 7, Android 16"
  - type: textarea
    id: logs
    attributes:
      label: السجل أو صور الشاشة
      description: احذف أي روابط حقيقية أو بيانات شخصية قبل الإرفاق.
