name: Build Al-othmany R4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - universal-3.5.0-r1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Validate source
        run: python3 scripts/validate_source.py

      - name: Build Debug APK
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug --console=plain

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Al-othmany-Sender-3.5.0-R4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-othmany-Sender-3.5.0-R4
          path: Al-othmany-Sender-3.5.0-R4.apk
          if-no-files-found: error
          retention-days: 14
