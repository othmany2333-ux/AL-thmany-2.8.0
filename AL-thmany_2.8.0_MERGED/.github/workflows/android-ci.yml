name: AL-thmany Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Kotlin CLI
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin 2.3.21
          echo "$HOME/.sdkman/candidates/kotlin/current/bin" >> "$GITHUB_PATH"

      - name: Validate source and resources
        run: python3 scripts/validate_source.py

      - name: Compile pure Kotlin domain
        run: bash scripts/compile_pure_kotlin.sh

      - name: Run pure Kotlin regression scenarios
        run: bash scripts/run_pure_kotlin_regressions.sh

      - name: Run Smart Runtime micro-benchmark
        run: bash scripts/run_runtime_benchmarks.sh

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace --configuration-cache testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace --configuration-cache lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --configuration-cache assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: al-thmany-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
